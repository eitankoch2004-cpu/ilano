<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ILANO — ניהול</title>

<!-- ============================================================
     פאנל ניהול — ILANO
     ------------------------------------------------------------
     ⚠️ סיסמאות לא מוצגות כאן ולא נשמרות בשום מקום.
        Supabase שומרת אותן כ-hash חד-כיווני — גם היא לא
        יכולה לקרוא אותן, וזה הדבר הנכון.
        במקום סיסמה: כפתור "שליחת קישור איפוס".

     🔴 ההגנה האמיתית היא ב-Supabase (RLS), לא כאן.
        התצוגה admin_users מחזירה אפס שורות למי שאינו
        רשום בטבלת admins. גם אם מישהו יפתח את העמוד הזה,
        הוא לא יראה כלום.
     ============================================================ -->

<style>
:root{
  --paper:#F6F9FB; --card:#fff;
  --ink:#0A1E38; --ink-mid:#3A5068; --ink-soft:#8593A8;
  --line:#DDE5EC; --line-soft:#EDF2F6;
  --brand:#2E86AB; --brand-deep:#14365F;
  --ok:#2FAE8E; --warn:#D9A520; --bad:#C94F4F;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(10,30,56,.05),0 6px 18px -8px rgba(10,30,56,.16);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B1420; --card:#121E2E;
    --ink:#E8EEF5; --ink-mid:#AFC0D2; --ink-soft:#7C8EA4;
    --line:#223349; --line-soft:#1A2838;
    --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1420; --card:#121E2E;
  --ink:#E8EEF5; --ink-mid:#AFC0D2; --ink-soft:#7C8EA4;
  --line:#223349; --line-soft:#1A2838;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 14px/1.5 var(--font);
  padding:0 0 40px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* --- כותרת --- */
.top{
  position:sticky;top:0;z-index:5;
  background:color-mix(in srgb,var(--paper) 85%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:14px 0;margin-bottom:18px;
}
.top__in{max-width:1180px;margin:0 auto;padding:0 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;font-weight:900;margin:0;letter-spacing:-.02em}
.sub{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.spacer{flex:1}

/* --- כפתורים --- */
.btn{
  font:800 12.5px/1 var(--font);
  padding:10px 15px;border-radius:var(--r-sm);
  border:1.5px solid var(--brand);background:var(--brand);color:#fff;
  cursor:pointer;touch-action:manipulation;
  transition:transform .12s cubic-bezier(.3,.9,.4,1),
             background-color .18s var(--ease),border-color .18s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn--ghost{background:transparent;color:var(--ink-mid);border-color:var(--line)}
.btn--sm{padding:7px 11px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}

/* --- כרטיסי סיכום --- */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:18px;
}
.stat{
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:14px;box-shadow:var(--sh);
}
.stat__n{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1}
.stat__l{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:5px}

/* --- חיפוש --- */
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.inp{
  flex:1;min-width:180px;
  font:600 13px/1 var(--font);padding:11px 13px;
  border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);color:var(--ink);
  transition:border-color .2s var(--ease);
}
.inp:focus{outline:none;border-color:var(--brand)}

/* --- טבלה --- */
.tbl__wrap{
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r);box-shadow:var(--sh);overflow:auto;
}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:start;font-size:10.5px;font-weight:800;
  color:var(--ink-soft);letter-spacing:.04em;
  padding:11px 12px;border-bottom:1.5px solid var(--line);
  white-space:nowrap;position:sticky;top:0;background:var(--card);
}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:none}
.nm{font-weight:800;color:var(--ink)}
.em{font-size:11.5px;color:var(--ink-mid);direction:ltr;text-align:start;
  font-variant-numeric:tabular-nums}
.mut{font-size:11px;color:var(--ink-soft);font-weight:600}
.num{font-variant-numeric:tabular-nums;font-weight:700}

/* --- תגיות מצב --- */
.pill{
  display:inline-block;font-size:10px;font-weight:800;
  padding:3px 8px;border-radius:99px;white-space:nowrap;
}
.pill--ok  {background:rgba(47,174,142,.14);color:#1C7A63}
.pill--warn{background:rgba(217,165,32,.16);color:#8A6A10}
.pill--bad {background:rgba(201,79,79,.14);color:#973939}
.pill--mut {background:var(--line-soft);color:var(--ink-soft)}

/* --- הודעות --- */
.msg{
  padding:13px 15px;border-radius:var(--r-sm);
  font-size:12.5px;font-weight:700;margin-bottom:14px;
}
.msg--bad {background:rgba(201,79,79,.1);color:#973939;
  border:1px solid rgba(201,79,79,.3)}
.msg--ok  {background:rgba(47,174,142,.1);color:#1C7A63;
  border:1px solid rgba(47,174,142,.3)}
.msg--info{background:var(--line-soft);color:var(--ink-mid)}

/* --- מסך כניסה --- */
.gate{max-width:360px;margin:80px auto;padding:0 16px}
.gate__box{
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:22px;box-shadow:var(--sh);
}
.fld{margin-bottom:12px}
.fld__l{display:block;font-size:11.5px;font-weight:800;
  color:var(--ink-mid);margin-bottom:5px}
.hide{display:none!important}

/* --- עריכת מנוי --- */
.row-edit{background:var(--line-soft)}
.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:9px;padding:4px 0 10px}
.sel{
  font:700 12px/1 var(--font);padding:9px 10px;
  border:1.5px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);width:100%;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;transition-duration:.01ms!important;
  }
}
@media (prefers-reduced-transparency:reduce){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card)}
}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>

<!-- מסך כניסה -->
<div class="gate" id="gate">
  <div class="gate__box">
    <h1 style="margin-bottom:4px">ILANO — ניהול</h1>
    <p class="sub" style="margin:0 0 18px">כניסה לחשבון האדמין</p>
    <div id="gateMsg"></div>
    <div class="fld">
      <label class="fld__l" for="em">מייל</label>
      <input class="inp" id="em" type="email" dir="ltr" autocomplete="username" style="width:100%">
    </div>
    <div class="fld">
      <label class="fld__l" for="pw">סיסמה</label>
      <input class="inp" id="pw" type="password" dir="ltr" autocomplete="current-password" style="width:100%">
    </div>
    <button class="btn" id="go" style="width:100%;margin-top:6px">כניסה</button>
  </div>
</div>

<!-- הפאנל -->
<div class="hide" id="panel">
  <div class="top">
    <div class="top__in">
      <div>
        <h1>ILANO — ניהול</h1>
        <div class="sub" id="who"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn btn--ghost btn--sm" id="refresh">רענון</button>
      <button class="btn btn--ghost btn--sm" id="csv">הורדת CSV</button>
      <button class="btn btn--ghost btn--sm" id="out">יציאה</button>
    </div>
  </div>

  <div class="wrap">
    <div id="msg"></div>

    <div class="stats" id="stats"></div>

    <div class="tools">
      <input class="inp" id="q" type="search" placeholder="חיפוש לפי שם, מייל או משפחה…">
      <select class="sel" id="filt" style="max-width:170px">
        <option value="">כל המשתמשים</option>
        <option value="paid">משלמים</option>
        <option value="free">ללא תשלום</option>
        <option value="expiring">פג בקרוב (30 יום)</option>
        <option value="expired">פג</option>
        <option value="unverified">מייל לא אומת</option>
      </select>
    </div>

    <div class="tbl__wrap">
      <table>
        <thead><tr>
          <th>שם</th>
          <th>מייל</th>
          <th>נרשם</th>
          <th>כניסה אחרונה</th>
          <th>משפחה</th>
          <th>בני בית</th>
          <th>מסמכים</th>
          <th>מנוי</th>
          <th>שולם</th>
          <th>בתוקף עד</th>
          <th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <p class="mut" style="margin-top:14px;line-height:1.6">
      🔴 סיסמאות אינן מוצגות ואינן נשמרות. Supabase שומרת אותן
      כ-hash חד-כיווני — לא ניתן לשחזר סיסמה, רק לאפס אותה.
      לעזרה למשתמש: כפתור <strong>איפוס</strong> בשורה שלו.
    </p>
  </div>
</div>

<script src="db/supabase.min.js"></script>
<script>
/* ============================================================
   חיבור — אותו בסיס נתונים כמו האפליקציה.
   anon key הוא מפתח ציבורי; ההגנה היא ב-RLS בשרת.
   ============================================================ */
var SB_URL = "https://egefetbuvuxromcwtsie.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnZWZldGJ1dnV4cm9tY3d0c2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MzIyNDMsImV4cCI6MjEwNjEwODI0M30.UTdsjC-itR5taABeFHNzDqVI2zr0FPHFGnSZtF2SGzA";

var sb = null, DATA = [], editing = null;

var $ = function(s){ return document.querySelector(s); };
var esc = function(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
};

function note(el, kind, txt){
  $(el).innerHTML = txt
    ? '<div class="msg msg--' + kind + '">' + esc(txt) + '</div>' : "";
}

function dt(s){
  if (!s) return "—";
  var d = new Date(s);
  return d.toLocaleDateString("he-IL", {day:"2-digit",month:"2-digit",year:"2-digit"});
}

/* ---------- עלייה ---------- */
(function init(){
  if (!window.supabase || !window.supabase.createClient){
    note("#gateMsg","bad","ספריית Supabase לא נטענה");
    return;
  }
  sb = window.supabase.createClient(SB_URL, SB_KEY);

  $("#go").addEventListener("click", login);
  $("#pw").addEventListener("keydown", function(e){
    if (e.key === "Enter") login();
  });
  $("#out").addEventListener("click", async function(){
    await sb.auth.signOut();
    location.reload();
  });
  $("#refresh").addEventListener("click", load);
  $("#csv").addEventListener("click", exportCSV);
  $("#q").addEventListener("input", render);
  $("#filt").addEventListener("change", render);

  /* כבר מחובר? */
  sb.auth.getUser().then(function(r){
    if (r && r.data && r.data.user) open(r.data.user);
  });
})();

async function login(){
  var em = $("#em").value.trim(), pw = $("#pw").value;
  if (!em || !pw) return note("#gateMsg","bad","יש למלא מייל וסיסמה");

  var b = $("#go");
  b.disabled = true; b.textContent = "מתחבר…";
  note("#gateMsg","",null);

  var r = await sb.auth.signInWithPassword({email:em, password:pw});

  b.disabled = false; b.textContent = "כניסה";
  if (r.error) return note("#gateMsg","bad","הכניסה נכשלה: " + r.error.message);
  open(r.data.user);
}

async function open(user){
  /* 🔴 הבדיקה האמיתית: התצוגה מחזירה שורות רק לאדמין.
     אם ריק — או שאין משתמשים, או שאינך אדמין. */
  $("#gate").classList.add("hide");
  $("#panel").classList.remove("hide");
  $("#who").textContent = user.email;
  load();
}

async function load(){
  note("#msg","info","טוען…");
  var r = await sb.from("admin_users")
                 .select("*")
                 .order("signed_up_at", {ascending:false});

  if (r.error){
    note("#msg","bad","שגיאה: " + r.error.message +
      " — ייתכן שטרם הרצת את admin-setup.sql");
    return;
  }

  DATA = r.data || [];
  if (!DATA.length){
    note("#msg","bad",
      "אין נתונים. או שאין עוד משתמשים, או שהחשבון הזה אינו " +
      "רשום בטבלת admins — יש להריץ את docs/admin-setup.sql.");
  } else {
    note("#msg","",null);
  }
  stats(); render();
}

/* ---------- סיכומים ---------- */
function stats(){
  var paid = DATA.filter(function(u){
    return u.amount_agorot > 0 && u.sub_status === "active";
  });
  var rev = paid.reduce(function(s,u){ return s + (u.amount_agorot||0); }, 0);
  var exp = DATA.filter(function(u){
    return u.days_left != null && u.days_left >= 0 && u.days_left <= 30;
  });
  var mem = DATA.reduce(function(s,u){ return s + (u.members_count||0); }, 0);

  var c = [
    [DATA.length, "משתמשים"],
    [paid.length, "משלמים"],
    [(rev/100).toLocaleString("he-IL",{maximumFractionDigits:0}) + " ₪", "הכנסה מצטברת"],
    [mem, "בני משפחה בסך הכל"],
    [exp.length, "פג בתוך 30 יום"]
  ];
  $("#stats").innerHTML = c.map(function(x){
    return '<div class="stat"><div class="stat__n">' + esc(x[0]) +
           '</div><div class="stat__l">' + esc(x[1]) + '</div></div>';
  }).join("");
}

/* ---------- סינון ---------- */
function filtered(){
  var q = $("#q").value.trim().toLowerCase();
  var f = $("#filt").value;

  return DATA.filter(function(u){
    if (q){
      var hay = [u.full_name, u.email, u.household_name, u.members_names]
                .join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (f === "paid")       return u.amount_agorot > 0;
    if (f === "free")       return !u.amount_agorot;
    if (f === "expiring")   return u.days_left != null &&
                                   u.days_left >= 0 && u.days_left <= 30;
    if (f === "expired")    return u.days_left != null && u.days_left < 0;
    if (f === "unverified") return !u.email_verified;
    return true;
  });
}

/* ---------- תגית מנוי ---------- */
function planPill(u){
  var name = {free:"חינם", trial:"ניסיון", monthly:"חודשי",
              yearly:"שנתי", lifetime:"לכל החיים"}[u.plan] || "חינם";

  var k = "mut";
  if (u.sub_status === "active" && u.amount_agorot > 0) k = "ok";
  if (u.sub_status === "past_due") k = "warn";
  if (u.sub_status === "expired" || u.sub_status === "canceled") k = "bad";
  if (u.days_left != null && u.days_left < 0) k = "bad";

  return '<span class="pill pill--' + k + '">' + esc(name) + '</span>';
}

function expiryCell(u){
  if (!u.expires_at) return u.plan === "lifetime"
    ? '<span class="pill pill--ok">ללא הגבלה</span>'
    : '<span class="mut">—</span>';

  var d = dt(u.expires_at);
  if (u.days_left == null) return '<span class="mut">' + d + '</span>';
  if (u.days_left < 0)
    return d + '<br><span class="pill pill--bad">פג לפני ' +
           Math.abs(u.days_left) + ' ימים</span>';
  if (u.days_left <= 30)
    return d + '<br><span class="pill pill--warn">' +
           u.days_left + ' ימים</span>';
  return d + '<br><span class="mut">' + u.days_left + ' ימים</span>';
}

/* ---------- ציור הטבלה ---------- */
function render(){
  var rows = filtered();
  if (!rows.length){
    $("#rows").innerHTML =
      '<tr><td colspan="11" class="mut" style="padding:24px;text-align:center">' +
      'אין תוצאות</td></tr>';
    return;
  }

  $("#rows").innerHTML = rows.map(function(u){
    var names = u.members_names
      ? '<div class="mut" style="margin-top:3px;max-width:200px">' +
        esc(u.members_names) + '</div>' : "";

    var main =
      '<tr' + (editing === u.user_id ? ' class="row-edit"' : '') + '>' +
        '<td><div class="nm">' + esc(u.full_name || "—") + '</div>' +
            (u.email_verified ? "" :
              '<span class="pill pill--warn" style="margin-top:3px">מייל לא אומת</span>') +
        '</td>' +
        '<td class="em">' + esc(u.email) + '</td>' +
        '<td class="mut">' + dt(u.signed_up_at) + '</td>' +
        '<td class="mut">' + dt(u.last_sign_in_at) + '</td>' +
        '<td>' + esc(u.household_name || "—") + '</td>' +
        '<td class="num">' + (u.members_count || 0) + names + '</td>' +
        '<td class="num">' + (u.docs_count || 0) + '</td>' +
        '<td>' + planPill(u) + '</td>' +
        '<td class="num">' +
          (u.amount_agorot
            ? (u.amount_agorot/100).toLocaleString("he-IL") + ' ₪' +
              '<div class="mut">' + dt(u.paid_at) + '</div>' +
              (u.provider ? '<div class="mut">' + esc(u.provider) + '</div>' : "")
            : '<span class="mut">—</span>') +
        '</td>' +
        '<td>' + expiryCell(u) + '</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="btn btn--ghost btn--sm" data-edit="' + esc(u.user_id) +
            '">מנוי</button> ' +
          '<button class="btn btn--ghost btn--sm" data-reset="' + esc(u.email) +
            '">איפוס</button>' +
        '</td>' +
      '</tr>';

    /* שורת עריכת מנוי */
    if (editing === u.user_id){
      main +=
        '<tr class="row-edit"><td colspan="11">' +
          '<div class="edit">' +
            '<div><label class="fld__l">תוכנית</label>' +
              '<select class="sel" id="ePlan">' +
                ['free','trial','monthly','yearly','lifetime'].map(function(p){
                  var n = {free:"חינם",trial:"ניסיון",monthly:"חודשי",
                           yearly:"שנתי",lifetime:"לכל החיים"}[p];
                  return '<option value="' + p + '"' +
                    (u.plan === p ? " selected" : "") + '>' + n + '</option>';
                }).join("") +
              '</select></div>' +

            '<div><label class="fld__l">סכום (₪)</label>' +
              '<input class="sel" id="eAmt" type="number" min="0" step="1" ' +
                'value="' + ((u.amount_agorot||0)/100) + '"></div>' +

            '<div><label class="fld__l">בתוקף עד</label>' +
              '<input class="sel" id="eExp" type="date" value="' +
                (u.expires_at ? String(u.expires_at).slice(0,10) : "") + '"></div>' +

            '<div><label class="fld__l">אמצעי</label>' +
              '<input class="sel" id="eProv" type="text" placeholder="bit / paybox / העברה" ' +
                'value="' + esc(u.provider || "") + '"></div>' +

            '<div><label class="fld__l">מצב</label>' +
              '<select class="sel" id="eStat">' +
                ['active','past_due','canceled','expired'].map(function(s){
                  var n = {active:"פעיל",past_due:"בפיגור",
                           canceled:"בוטל",expired:"פג"}[s];
                  return '<option value="' + s + '"' +
                    (u.sub_status === s ? " selected" : "") + '>' + n + '</option>';
                }).join("") +
              '</select></div>' +

            '<div style="display:flex;gap:7px;align-items:flex-end">' +
              '<button class="btn btn--sm" data-save="' + esc(u.user_id) +
                '">שמירה</button>' +
              '<button class="btn btn--ghost btn--sm" data-cancel="1">ביטול</button>' +
            '</div>' +
          '</div>' +
        '</td></tr>';
    }
    return main;
  }).join("");

  wire(rows);
}

function wire(rows){
  document.querySelectorAll("[data-edit]").forEach(function(b){
    b.addEventListener("click", function(){
      editing = (editing === b.dataset.edit) ? null : b.dataset.edit;
      render();
    });
  });
  document.querySelectorAll("[data-cancel]").forEach(function(b){
    b.addEventListener("click", function(){ editing = null; render(); });
  });
  document.querySelectorAll("[data-save]").forEach(function(b){
    b.addEventListener("click", function(){ save(b.dataset.save, rows); });
  });
  document.querySelectorAll("[data-reset]").forEach(function(b){
    b.addEventListener("click", function(){ sendReset(b.dataset.reset, b); });
  });
}

/* ---------- שמירת מנוי ---------- */
async function save(uid, rows){
  var u = rows.filter(function(x){ return x.user_id === uid; })[0];
  if (!u) return;

  var amt  = Math.round(parseFloat($("#eAmt").value || "0") * 100);
  var exp  = $("#eExp").value;
  var row = {
    user_id:       uid,
    household_id:  u.household_id || null,
    plan:          $("#ePlan").value,
    status:        $("#eStat").value,
    amount_agorot: isNaN(amt) ? 0 : amt,
    expires_at:    exp ? new Date(exp + "T23:59:59").toISOString() : null,
    provider:      $("#eProv").value.trim() || null
  };

  note("#msg","info","שומר…");
  var r = await sb.from("subscriptions").insert(row);

  if (r.error){
    note("#msg","bad","השמירה נכשלה: " + r.error.message);
    return;
  }
  editing = null;
  note("#msg","ok","המנוי עודכן");
  load();
}

/* ---------- איפוס סיסמה ---------- */
async function sendReset(email, btn){
  /* ⚠️ זה מה שמחליף "לראות את הסיסמה": המשתמש מקבל
     קישור למייל ובוחר סיסמה חדשה בעצמו. */
  if (!confirm("לשלוח קישור איפוס סיסמה ל-" + email + "?")) return;

  btn.disabled = true; btn.textContent = "שולח…";
  var r = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname.replace(/admin\.html$/, "")
  });
  btn.disabled = false; btn.textContent = "איפוס";

  if (r.error) note("#msg","bad","השליחה נכשלה: " + r.error.message);
  else         note("#msg","ok","קישור איפוס נשלח ל-" + email);
}

/* ---------- CSV ---------- */
function exportCSV(){
  var rows = filtered();
  var head = ["שם","מייל","נרשם","כניסה אחרונה","מייל אומת","משפחה",
              "בני בית","שמות בני הבית","מסמכים","תוכנית","מצב",
              "שולם ₪","תאריך תשלום","בתוקף עד","ימים שנותרו","אמצעי"];

  var body = rows.map(function(u){
    return [
      u.full_name, u.email, u.signed_up_at, u.last_sign_in_at,
      u.email_verified ? "כן" : "לא",
      u.household_name, u.members_count, u.members_names, u.docs_count,
      u.plan, u.sub_status,
      (u.amount_agorot||0)/100, u.paid_at, u.expires_at, u.days_left, u.provider
    ].map(function(v){
      var s = (v == null) ? "" : String(v);
      return '"' + s.replace(/"/g,'""') + '"';
    }).join(",");
  });

  /* BOM — כדי שאקסל יציג עברית נכון */
  var csv = "﻿" + head.map(function(h){ return '"'+h+'"'; }).join(",") +
            "\n" + body.join("\n");

  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "ilano-users-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
