<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<title>בניית אייקוני ILANO</title><style>
body{font-family:system-ui;background:#0A1E38;color:#fff;padding:30px;margin:0;text-align:center}
h1{font-size:20px;margin:0 0 6px}
p{color:#8FD9D4;font-size:13px;margin:0 0 24px;line-height:1.6}
canvas{border-radius:22.5%;margin:8px;box-shadow:0 10px 26px -8px rgba(0,0,0,.7)}
#prev{display:flex;gap:16px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.ok{color:#7FE6A8;font-weight:700;font-size:15px;margin-top:22px;line-height:1.7}
.note{color:#9FB4CC;font-size:12px;margin-top:10px;line-height:1.6}
</style></head><body>
<h1>הנץ — אייקון ILANO</h1>
<p>שלושה קבצים יירדו. אחר כך אעביר אותם לתיקייה.</p>
<div id="prev"></div>
<div class="ok" id="done"></div>
<div class="note" id="note"></div>
<script>
var DEFS = `
<linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#2E86AB"/><stop offset="1" stop-color="#6FD4C4"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F4F7FA"/><stop offset="1" stop-color="#DCE7F0"/></linearGradient>`;

var SPROUT = `
<path d="M96 400h320" stroke="#14365F" stroke-width="13" stroke-linecap="round" opacity=".28"/>
<path d="M256 400V196" stroke="#2E86AB" stroke-width="19" stroke-linecap="round"/>
<path d="M248 264c-72-4-116-72-116-72s68-34 116 12c38 36 0 60 0 60z" fill="url(#leaf)"/>
<path d="M264 216c62-20 92-88 92-88s-72-18-110 34c-28 40 18 54 18 54z" fill="#6FD4C4"/>
<path d="M340 146c-42 30-66 62-80 100" stroke="#F4F7FA" stroke-width="7" fill="none" opacity=".5" stroke-linecap="round"/>
<circle cx="256" cy="176" r="19" fill="#14365F"/>`;

var ART = '<rect width="512" height="512" fill="url(#paper)"/>' + SPROUT;

/* maskable — אנדרואיד חותך פינות, לכן הציור מוקטן ל-76% */
var ART_MASK =
 '<rect width="512" height="512" fill="#F4F7FA"/>' +
 '<g transform="translate(256,256) scale(.76) translate(-256,-256)">' + SPROUT + '</g>';

function draw(art, size, name){
  return new Promise(function(res){
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs>'+DEFS+'</defs>'+art+'</svg>';
    var img = new Image();
    var url = URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
    img.onload = function(){
      var c = document.createElement("canvas");
      c.width = size; c.height = size;
      c.getContext("2d").drawImage(img, 0, 0, size, size);
      c.style.width  = Math.min(size,150)+"px";
      c.style.height = Math.min(size,150)+"px";
      document.getElementById("prev").appendChild(c);
      c.toBlob(function(b){
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
        res();
      }, "image/png");
    };
    img.src = url;
  });
}

(async function(){
  await draw(ART, 192, "icon-192.png");
  await new Promise(r=>setTimeout(r,600));
  await draw(ART, 512, "icon-512.png");
  await new Promise(r=>setTimeout(r,600));
  await draw(ART_MASK, 512, "icon-maskable.png");
  document.getElementById("done").textContent = "✓ שלושת הקבצים ירדו";
  document.getElementById("note").textContent =
    "השמאלי 192 · האמצעי 512 · הימני maskable (מוקטן לחיתוך אנדרואיד)";
})();
</script></body></html>
