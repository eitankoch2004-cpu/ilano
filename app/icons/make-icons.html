<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<title>יצירת אייקונים</title><style>
body{font-family:system-ui;background:#0A1E38;color:#fff;padding:24px;text-align:center}
canvas{border-radius:22px;margin:8px;box-shadow:0 8px 30px -10px rgba(0,0,0,.6)}
button{background:#2E86AB;color:#fff;border:0;padding:14px 28px;border-radius:10px;
font-size:15px;font-weight:700;cursor:pointer;margin:16px 6px}
p{color:#8FD9D4;font-size:14px}
</style></head><body>
<h2>אייקוני ILANO</h2>
<p>לחץ על הכפתור — שלושה קבצים יירדו. גרור אותם לתיקיית icons</p>
<div id="prev"></div>
<button onclick="go()">צור והורד אייקונים</button>
<script>
var SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1D4A7A"/><stop offset="1" stop-color="#0A1E38"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#2E86AB"/><stop offset="1" stop-color="#6FD4C4"/></linearGradient>
<linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2E86AB"/><stop offset="1" stop-color="#6FD4C4"/></linearGradient>
</defs>
<rect width="512" height="512" rx="RADIUS" fill="url(#bg)"/>
<path d="M232 300C232 196 252 132 252 132s28 72 14 128c-10 40-34 40-34 40z" fill="url(#leaf)"/>
<path d="M268 296c78-14 134-72 134-72s-14 82-64 110c-40 22-70-38-70-38z" fill="url(#leaf)" opacity=".94"/>
<path d="M392 236c-52 46-90 86-112 142" stroke="#fff" stroke-width="9" fill="none" opacity=".45" stroke-linecap="round"/>
<path d="M150 392c42-42 84-42 126 0s84 42 126 0" stroke="url(#wave)" stroke-width="30" fill="none" stroke-linecap="round"/>
</svg>`;
function draw(size, radius, name){
  return new Promise(function(res){
    var svg = SVG.replace("RADIUS", radius);
    var img = new Image();
    var blob = new Blob([svg], {type:"image/svg+xml"});
    var url = URL.createObjectURL(blob);
    img.onload = function(){
      var c = document.createElement("canvas");
      c.width = size; c.height = size;
      c.getContext("2d").drawImage(img, 0, 0, size, size);
      document.getElementById("prev").appendChild(c);
      c.style.width = "120px"; c.style.height = "120px";
      c.toBlob(function(b){
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b); a.download = name; a.click();
        URL.revokeObjectURL(url); res();
      }, "image/png");
    };
    img.src = url;
  });
}
async function go(){
  document.getElementById("prev").innerHTML = "";
  await draw(192, 42, "icon-192.png");
  await new Promise(r=>setTimeout(r,400));
  await draw(512, 112, "icon-512.png");
  await new Promise(r=>setTimeout(r,400));
  await draw(512, 0, "icon-maskable.png");
}
go();
</script></body></html>
